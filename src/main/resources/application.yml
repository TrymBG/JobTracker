spring:
  application:
    name: jobtracker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:jobtracker}
    username: ${POSTGRES_USER:jobtracker}
    password: ${POSTGRES_PASSWORD:jobtracker_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: ${JWT_SECRET:this-is-a-local-dev-only-secret-key-not-for-production-use}
  expiration-ms: 3600000
